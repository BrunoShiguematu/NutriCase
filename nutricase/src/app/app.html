<mat-sidenav-container class="shell">
  <mat-sidenav class="side" mode="side" opened #sidenav>
    <nav aria-label="Navegação principal">
      <mat-nav-list>
        <a mat-list-item class="menu-dashboard" routerLink="/dashboard" routerLinkActive ariaCurrentWhenActive="page" #rlaDashboard="routerLinkActive"
           [activated]="rlaDashboard.isActive">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item class="menu-casos" routerLink="/casos" routerLinkActive ariaCurrentWhenActive="page" #rlaCasos="routerLinkActive"
           [routerLinkActiveOptions]="{ exact: true }" [activated]="rlaCasos.isActive">
          <mat-icon matListItemIcon>folder_open</mat-icon>
          <span matListItemTitle>Casos</span>
        </a>
        <a mat-list-item class="menu-gestao" routerLink="/casos/gestao" routerLinkActive ariaCurrentWhenActive="page" #rlaGestao="routerLinkActive"
           [activated]="rlaGestao.isActive">
          <mat-icon matListItemIcon>edit_note</mat-icon>
          <span matListItemTitle>Gestão de casos</span>
        </a>
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="top">
      <button mat-icon-button type="button" (click)="sidenav.toggle()" [attr.aria-expanded]="sidenav.opened" aria-label="Abrir ou fechar o menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="brand">{{ title }}</span>
    </mat-toolbar>

    <p class="disclaimer">Ferramenta educacional · casos fictícios · sem finalidade clínica</p>

    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
