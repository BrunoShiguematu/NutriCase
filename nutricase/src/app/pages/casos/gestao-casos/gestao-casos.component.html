<header class="page-header">
  <h1 class="page-title">Gestão de casos</h1>
  <a mat-flat-button class="novo-caso" routerLink="/casos/gestao/novo">Novo caso</a>
</header>

<table mat-table class="tabela-casos" aria-label="Casos cadastrados" [dataSource]="casos()">
  <ng-container matColumnDef="titulo">
    <th mat-header-cell *matHeaderCellDef>Título</th>
    <td mat-cell class="coluna-titulo" *matCellDef="let caso">{{ caso.titulo }}</td>
  </ng-container>

  <ng-container matColumnDef="nivel">
    <th mat-header-cell *matHeaderCellDef>Nível</th>
    <td mat-cell class="coluna-nivel" *matCellDef="let caso">{{ caso.nivel }}</td>
  </ng-container>

  <ng-container matColumnDef="modalidade">
    <th mat-header-cell *matHeaderCellDef>Modalidade</th>
    <td mat-cell class="coluna-modalidade" *matCellDef="let caso">{{ caso.modalidade }}</td>
  </ng-container>

  <ng-container matColumnDef="acoes">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell class="coluna-acoes" *matCellDef="let caso">
      <a
        mat-button
        class="acao-editar"
        [routerLink]="['/casos/gestao', caso.id, 'editar']"
        [attr.aria-label]="'Editar ' + caso.titulo"
      >
        Editar
      </a>
      <button
        mat-button
        type="button"
        class="acao-excluir"
        [attr.aria-label]="'Excluir ' + caso.titulo"
        (click)="excluir(caso)"
      >
        Excluir
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colunas"></tr>
  <tr mat-row class="linha-caso" *matRowDef="let caso; columns: colunas"></tr>
</table>

@if (casos().length === 0) {
  <p class="sem-casos">Nenhum caso cadastrado</p>
}
