<h2 mat-dialog-title>Excluir caso?</h2>

<mat-dialog-content class="confirmar-texto">
  Você vai excluir o caso <strong class="confirmar-titulo">{{ dados.titulo }}</strong> e a ficha do atleta dele.
  Esta ação não pode ser desfeita.
</mat-dialog-content>

<mat-dialog-actions align="end" class="confirmar-acoes">
  <button mat-button type="button" class="confirmar-cancelar" [mat-dialog-close]="false" cdkFocusInitial>
    Cancelar
  </button>
  <button mat-flat-button type="button" class="confirmar-excluir" [mat-dialog-close]="true">Excluir</button>
</mat-dialog-actions>
